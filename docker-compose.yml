# USHNA Full Edge Stack: docker compose up --build
# Dashboard + API: http://localhost:8000 (OpenAPI docs at /docs)
# Standalone service startup: docker compose up backend

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ushna-mosquitto
    ports: ["1883:1883"]
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: ushna-db
    environment:
      POSTGRES_DB: ushna
      POSTGRES_USER: ushna
      POSTGRES_PASSWORD: ushna
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-ushna-schema.sql:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ushna -d ushna"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      default:
        aliases:
          - db
          - timescaledb

  backend:
    build: .
    container_name: ushna-backend
    environment:
      MQTT_HOST: mosquitto
      DATABASE_URL: postgresql://ushna:ushna@db:5432/ushna
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend
          - ushna-edge

  simulator:
    build: .
    container_name: ushna-simulator
    command: ["python", "-m", "ushna.data.mqtt_publisher", "--interval", "1"]
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto-data:
  timescale-data:
